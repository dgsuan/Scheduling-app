name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-schedule-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: campus-schedule-app/package-lock.json

      - run: npm ci

      # Fast checks so a broken build never replaces the live site.
      # (The full browser suites run in the Tests workflow.)
      - name: Typecheck
        run: npm run typecheck

      - name: Logic tests
        run: npm run test:logic

      # Exports, then injects the PWA manifest + pre-paint theme into index.html.
      # Supabase keys come from repo Variables (Settings → Secrets and
      # variables → Actions → Variables). If unset, the site builds without sync.
      - name: Export web build
        run: npm run export:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a
      # hard refresh on a client-side route still loads the app.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: campus-schedule-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
