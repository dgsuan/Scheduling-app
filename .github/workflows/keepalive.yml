name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This calls a
# harmless database function every ~3 days. It uses the same public
# (publishable) key as the website — no secrets.
# Note: GitHub turns off scheduled workflows after 60 days with no commits;
# re-enable it in the Actions tab if that happens.

on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.EXPO_PUBLIC_SUPABASE_URL != '' }}
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
